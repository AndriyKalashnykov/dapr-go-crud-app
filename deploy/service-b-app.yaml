---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "service-b"
        dapr.io/app-port: "8080"
        dapr.io/config: dapr-crud-app
        dapr.io/log-as-json: "false"
        dapr.io/enable-api-logging: "true"
        dapr.io/log-level: "debug"
    spec:
      containers:
      - name: service-b
        image: andriykalashnykov/service-b-9acac2ae91b0dae0733e54792b512b0c:latest
        imagePullPolicy: Always