---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeline-app-deployment
spec:
  selector:
    matchLabels:
      app: timeline-app
  template:
    metadata:
      labels:
        app: timeline-app
      annotations:
        dapr.io/enabled: 'true'
        dapr.io/app-id: timeline-app
        dapr.io/app-port: '8080'
        dapr.io/config: dapr-go-crud-app
        dapr.io/sidecar-listen-addresses: 0.0.0.0
        dapr.io/log-as-json: 'true'
    spec:
      containers:
      - name: timeline-app
        image: ghcr.io/andriykalashnykov/dapr-go-crud-app/timeline:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /todos
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /todos
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
---
kind: Service
apiVersion: v1
metadata:
  name: timeline-app
spec:
  selector:
    app: timeline-app
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
