---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consumer-app
  template:
    metadata:
      labels:
        app: consumer-app
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "consumer-app"
        dapr.io/app-port: "8080"
        dapr.io/config: dapr-crud-app
        dapr.io/app-protocol: grpc
        dapr.io/log-as-json: "true"
    spec:
      containers:
      - name: app
        image: andriykalashnykov/consumer-b4adbe37b68878419c81572ea72032a5:latest
        imagePullPolicy: Always
