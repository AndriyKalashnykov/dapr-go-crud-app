---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-c
spec:
  selector:
    matchLabels:
      app: service-c
  template:
    metadata:
      labels:
        app: service-c
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "service-c"
        dapr.io/app-port: "8080"
        dapr.io/config: dapr-go-crud-app
        dapr.io/log-as-json: "false"
        dapr.io/enable-api-logging: "true"
        dapr.io/log-level: "debug"
    spec:
      containers:
      - name: service-c
        image: andriykalashnykov/service-c-5a23aea44e262141cfa51496b5dee9e3:latest
        imagePullPolicy: Always
