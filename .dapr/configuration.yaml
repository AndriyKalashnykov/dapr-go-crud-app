apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-go-crud-app
spec:
  metric:
    enabled: true
  # tracing:
  #   samplingRate: "1"
  #   zipkin:
  #     endpointAddress: "http://zipkin:9411/api/v2/spans"
  # `controlPlaneTrustDomain` AND `sentryAddress` are STRUCTURALLY required
  # by the Dapr 1.17+ Configuration CRD's OpenAPI schema regardless of
  # `enabled`. We disable mTLS at apply-time (`make dapr-install` passes
  # `--set global.mtls.enabled=false`), but the CRD won't validate without
  # the fields populated, so we provide the canonical Dapr defaults here.
  # To re-enable mTLS for production, drop the `global.mtls.enabled=false`
  # flag from `make dapr-install` and flip `enabled: true` below.
  mtls:
    enabled: false
    allowedClockSkew: 15m
    workloadCertTTL: 24h
    controlPlaneTrustDomain: cluster.local
    sentryAddress: dapr-sentry.dapr-system.svc:443
  # api:
    # allowed:
    # - name: state
    #   version: v1
    #   protocol: http
    # - name: publish
    #   version: v1
    #   protocol: http
    # TODO enable service-to-service invocation and configure ACLs
