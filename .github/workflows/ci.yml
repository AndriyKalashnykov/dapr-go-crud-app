name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          # 'base' is silently ignored on pull_request events; only set it on push.
          base: ${{ github.event_name == 'push' && 'main' || '' }}
          filters: |
            code:
              - '**'
              - '!**.md'
              - '!LICENSE'

  static-check:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Static check
        run: make static-check

  build:
    needs: [changes, static-check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Build
        run: make build

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: binaries
          include-hidden-files: true
          path: .bin/
          retention-days: 14

  test:
    needs: [changes, static-check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Test
        run: make test

  integration-test:
    needs: [changes, static-check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Integration test
        run: make integration-test

  e2e:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND_CLUSTER_NAME: dapr-go-crud-app
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced # v1.9.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 90s

      - name: Install Dapr control plane
        run: make dapr-install

      - name: Deploy Redis
        run: make e2e-redis-deploy

      - name: Apply manifests (Dapr config + components + Deployments)
        run: make e2e-apply

      - name: Smoke test
        run: make e2e-smoke

      - name: Diagnostic dump on failure
        if: failure()
        run: |
          kubectl --context="kind-${KIND_CLUSTER_NAME}" get pods -A -o wide || true
          kubectl --context="kind-${KIND_CLUSTER_NAME}" describe pods -n crud-app || true
          kubectl --context="kind-${KIND_CLUSTER_NAME}" logs -n crud-app -l app=crud-app --tail=200 || true
          kubectl --context="kind-${KIND_CLUSTER_NAME}" logs -n crud-app -l app=timeline-app --tail=200 || true

  ci-pass:
    if: always()
    needs: [changes, static-check, build, test, integration-test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -e
          echo "$NEEDS_JSON" | jq -r 'to_entries | .[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e 'to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | length == 0' >/dev/null; then
            echo "All jobs passed or were skipped (doc-only change)."
          else
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
