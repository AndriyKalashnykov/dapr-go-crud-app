name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          # 'base' is silently ignored on pull_request events; only set it on push.
          base: ${{ github.event_name == 'push' && 'main' || '' }}
          # POSITIVE allow-list, NOT a `**`+negation form. dorny/paths-filter's
          # default `some` quantifier makes `- '**'` always match, so a
          # `- '**' / - '!**.md'` list is DEAD (every change classified as code —
          # verified empirically). picomatch `!(...)` extglobs are also unreliable
          # for deep paths. An allow-list of standalone positive patterns is the
          # only form that classifies correctly here. A NEW top-level code dir
          # MUST be added here or its changes silently skip CI.
          filters: |
            code:
              - 'cmd/**'
              - 'pkg/**'
              - 'deploy/**'
              - '.dapr/**'
              - 'scripts/**'
              - 'docs/diagrams/**/*.puml'
              - '.github/workflows/**'
              - 'Makefile'
              - '.mise.toml'
              - '.golangci.yml'
              - 'go.mod'
              - 'go.sum'
              - 'renovate.json'
              - '.env.example'
              - '.gitignore'
              - 'version.txt'
              - 'CLAUDE.md'
            docs:
              - '**.md'

  # Cheap doc-only lint: a docs-only change (code=false) that touches a doc
  # carrying an embedded Mermaid diagram (README) skips static-check, so
  # validate the diagram here. On code changes this job is skipped and the
  # same `make mermaid-lint` runs inside static-check instead (no double run).
  mermaid-lint:
    needs: [changes]
    if: needs.changes.outputs.code != 'true' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Mermaid lint
        run: make mermaid-lint

  static-check:
    needs: [changes]
    # On tag push, paths-filter sees HEAD == base (tag points at main) so
    # `code` is false — but we want every gate to run before publish.
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Static check
        run: make static-check

  build:
    needs: [changes, static-check]
    # On tag push, paths-filter sees HEAD == base (tag points at main) so
    # `code` is false — but we want every gate to run before publish.
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Build
        run: make build

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: binaries
          include-hidden-files: true
          path: .bin/
          retention-days: 14

  test:
    needs: [changes, static-check]
    # On tag push, paths-filter sees HEAD == base (tag points at main) so
    # `code` is false — but we want every gate to run before publish.
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Test
        run: make test

  integration-test:
    needs: [changes, static-check]
    # On tag push, paths-filter sees HEAD == base (tag points at main) so
    # `code` is false — but we want every gate to run before publish.
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Integration test
        run: make integration-test

  e2e:
    needs: [changes, build, test]
    # On tag push, paths-filter sees HEAD == base (tag points at main) so
    # `code` is false — but we want every gate to run before publish.
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND_CLUSTER_NAME: dapr-go-crud-app
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced # v1.9.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 90s

      - name: Install Dapr control plane
        run: make dapr-install

      - name: Deploy Redis
        run: make e2e-redis-deploy

      - name: Build and load images into KinD
        run: make e2e-load-images

      - name: Apply manifests
        run: make e2e-apply

      - name: Smoke test
        run: make e2e-smoke

      - name: Diagnostic dump on failure
        if: failure()
        run: |
          kubectl --context="kind-${KIND_CLUSTER_NAME}" get pods -A -o wide || true
          kubectl --context="kind-${KIND_CLUSTER_NAME}" describe pods -n crud-app || true
          kubectl --context="kind-${KIND_CLUSTER_NAME}" logs -n crud-app -l app=crud-app --tail=200 || true
          kubectl --context="kind-${KIND_CLUSTER_NAME}" logs -n crud-app -l app=timeline-app --tail=200 || true

  # Tag-gated supply-chain pipeline. Per /harden-image-pipeline Pattern A:
  # build local single-arch → trivy image scan → smoke → multi-arch publish
  # to GHCR (provenance/sbom OFF so the image index stays free of
  # unknown/unknown attestation entries and the GHCR "OS / Arch" tab
  # renders) → cosign keyless OIDC signing by digest. One matrix entry per
  # binary; ko handles the build (no Dockerfile in this project).
  docker:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [static-check, build, test, integration-test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write    # GHCR push
      id-token: write    # cosign keyless OIDC
    strategy:
      fail-fast: false
      matrix:
        binary: [app, consumer, datagen, dummy, errorgen, publisher, service-a, service-b, service-c, timeline]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      # Docker/OCI refs must be all-lowercase, but `github.repository`
      # preserves original GitHub account casing (`AndriyKalashnykov/...`).
      # Lowercase once into $GITHUB_ENV so every downstream step sees the
      # right ref. (See `/harden-image-pipeline` §"GHCR namespace rule".)
      - name: Compute lowercase KO_DOCKER_REPO
        run: |
          repo="${{ github.repository }}"
          echo "KO_DOCKER_REPO=ghcr.io/${repo,,}" >> "$GITHUB_ENV"

      - name: Build image for scan
        env:
          KO_DOCKER_REPO: ko.local
        run: |
          ko build --local --base-import-paths --tags=scan ./cmd/${{ matrix.binary }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: ko.local/${{ matrix.binary }}:scan
          # `image` subcommand only supports vuln + secret + license; `misconfig`
          # is filesystem/config-only and triggers `unable to parse scanners`.
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test
        run: bash scripts/image-smoke-test.sh "ko.local/${{ matrix.binary }}:scan"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: ko_publish
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # ko prints the digest-pinned ref on stdout's last line.
          digest_ref=$(ko publish \
            --base-import-paths \
            --platform=linux/amd64,linux/arm64 \
            --tags="${VERSION_TAG},latest" \
            ./cmd/${{ matrix.binary }} \
            | tail -1)
          echo "Published: ${digest_ref}"
          echo "digest_ref=${digest_ref}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign image with cosign
        env:
          DIGEST_REF: ${{ steps.ko_publish.outputs.digest_ref }}
        run: |
          set -euo pipefail
          echo "→ cosign sign ${DIGEST_REF}"
          cosign sign --yes "${DIGEST_REF}"

  ci-pass:
    if: always()
    needs: [changes, mermaid-lint, static-check, build, test, integration-test, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -e
          echo "$NEEDS_JSON" | jq -r 'to_entries | .[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e 'to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | length == 0' >/dev/null; then
            echo "All jobs passed or were skipped (doc-only change / non-tag push)."
          else
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
