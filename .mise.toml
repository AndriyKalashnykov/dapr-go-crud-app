# Tracked by Renovate's native `mise` manager (no inline annotations needed).
# Each aqua: / go: backend resolves to GitHub releases automatically.

[tools]
go             = "1.26.4"
node           = "24"

"aqua:golangci/golangci-lint"           = "2.12.2"
"aqua:ko-build/ko"                      = "0.19.1"
"aqua:nektos/act"                       = "0.2.89"
"aqua:securego/gosec"                   = "2.27.1"
"aqua:gitleaks/gitleaks"                = "8.30.1"
"aqua:aquasecurity/trivy"               = "0.72.0"
"aqua:rhysd/actionlint"                 = "1.7.12"
"aqua:koalaman/shellcheck"              = "0.11.0"
"go:golang.org/x/vuln/cmd/govulncheck"  = "1.3.0"

# Kubernetes / Dapr e2e toolchain
"aqua:kubernetes-sigs/kind"             = "0.32.0"
"aqua:kubernetes/kubernetes/kubectl"    = "1.36.2"
"aqua:helm/helm"                        = "3.20.2"
"aqua:dapr/cli"                         = "1.17.1"

# Image-supply-chain toolchain — ko (already above), cosign for signing,
# crane for `make image-sign` digest lookups.
"aqua:sigstore/cosign"                  = "3.1.1"
"aqua:google/go-containerregistry"      = "0.21.7"
